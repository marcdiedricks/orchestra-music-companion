name: Extract Additional Music PDFs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Additional Music
        run: |
          mkdir -p assets/additional-music
          unzip -o additional-music.zip -d assets/additional-music

      - name: Commit extracted PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/additional-music
          git commit -m "BUILD 0.1B-01B: extract Additional Music PDFs" || exit 0
          git push

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Orchestra Music Companion</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#050b16}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#050b16,#0b1424);padding:clamp(18px,4vw,42px)}main{max-width:1050px;margin:auto}.hero,.collection{padding:clamp(22px,4vw,38px);border:1px solid #24324a;border-radius:24px;background:#111b2d}.hero{margin-bottom:24px}.eyebrow{font-weight:800;letter-spacing:.12em;color:#f59e0b;font-size:.82rem}.hero h1{font-size:clamp(2rem,5vw,3.6rem);margin:.35rem 0}.hero p,.card p,.hint,.note{color:#aebbd0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{width:100%;min-height:190px;text-align:left;border:1px solid #2a3a55;border-radius:24px;padding:26px;background:#111b2d;color:#fff}.card .num{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#f59e0b;color:#111827;font-weight:900;margin-bottom:22px}.card h2{font-size:clamp(1.25rem,3vw,2rem);margin:0 0 8px}.screen{display:none}.screen.active{display:block}.back{border:1px solid #33445f;background:#162238;color:#fff;padding:14px 18px;border-radius:14px;font-weight:800;margin-bottom:22px}.collection h2{font-size:clamp(2rem,5vw,3.5rem);margin:.2rem 0 1rem}.finder{margin-top:28px;padding:clamp(18px,4vw,30px);border-radius:20px;background:#08111f;border:1px solid #2a3a55}.finder h3{font-size:clamp(1.35rem,3vw,2rem);margin:0 0 8px}.volume{display:none;gap:10px;margin:16px 0}.volume.show{display:flex}.volume button{flex:1;padding:14px;border:1px solid #33445f;border-radius:14px;background:#162238;color:#fff;font-weight:850}.volume button.active{background:#f59e0b;color:#111827}.display{width:100%;font-size:2rem;font-weight:800;text-align:center;padding:18px;border:2px solid #33445f;border-radius:16px;background:#050b16;color:#fff;margin:18px 0}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.key{min-height:72px;border:1px solid #33445f;border-radius:16px;background:#162238;color:#fff;font-size:1.55rem;font-weight:850}.clear{background:#3a1020}.go{background:#f59e0b;color:#111827}.result{display:none;margin-top:20px;padding:20px;border-radius:16px;background:#111b2d;border:1px solid #33445f}.result.show{display:block}.result strong{display:block;font-size:1.35rem;margin-bottom:7px}.badge{display:inline-block;margin-top:12px;padding:7px 10px;border-radius:999px;background:#173524;color:#b7f7ca;font-size:.8rem;font-weight:800}.full{width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;background:#f59e0b;color:#111827;font-weight:900;font-size:1.05rem}.full:disabled{opacity:.45}.viewer{position:fixed;inset:0;z-index:50;background:#07101e;display:none;flex-direction:column}.viewer.show{display:flex}.viewerbar{display:flex;align-items:center;gap:12px;padding:12px;background:#111b2d;border-bottom:1px solid #2a3a55}.viewerbar button{padding:12px 16px;border:1px solid #33445f;border-radius:12px;background:#162238;color:#fff;font-weight:850}.viewerbar strong{flex:1;font-size:1rem}.canvaswrap{flex:1;overflow:auto;background:#dfe6ee;padding:10px;display:flex;justify-content:center;align-items:flex-start}.canvaswrap canvas{display:block;max-width:100%;height:auto;background:#fff;box-shadow:0 2px 10px #0005}.status{padding:10px;text-align:center;color:#aebbd0;background:#08111f}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{min-height:150px}}</style></head><body><main><section id="home" class="screen active"><div class="hero"><div class="eyebrow">BUILD 0.1A-04R3 • APP-CONTROLLED SHEET VIEWER</div><h1>Orchestra Music Companion</h1><p>Select a music collection.</p></div><div class="grid"><button class="card" data-id="mix isplay:none">VERIFIED SOURCE INDEX</span><button id="full" class="full" disabled>OPEN SHEET</button></div></div></div></section></main><section id="viewer" class="viewer"><div class="viewerbar"><button id="viewerBack">← BACK</button><strong id="viewerTitle">Sheet</strong></div><div id="status" class="status">Loading sheet…</div><div class="canvaswrap"><canvas id="pdfCanvas"></canvas></div></section><script src="data/mixed-choir-index.js"></script><script src="data/orchestra-index.js"></script><script src="data/afrikaans-organist-index.js"></script><script src="data/english-organist-index.js"></script><script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs" type="module"></script><script type="module">import * as pdfjsLib from 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs';pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';const home=document.getElementById('home'),collection=document.getElementById('collection'),title=document.getElementById('collectionTitle'),display=document.getElementById('numberDisplay'),result=document.getElementById('result'),resultTitle=document.getElementById('resultTitle'),resultText=document.getElementById('resultText'),full=document.getElementById('full'),verified=document.getElementById('verified'),volume=document.getElementById('volume'),v1=document.getElementById('v1'),v2=document.getElementById('v2'),viewer=document.getElementById('viewer'),viewerTitle=document.getElementById('viewerTitle'),status=document.getElementById('status'),canvas=document.getElementById('pdfCanvas');let activeCollection='',activeVolume='vol1',activeHit=null,activeNumber='';const SOURCE_FILES={mixed:'sources/mixed-choir.pdf'};function resetFinder(){display.value='';result.classList.remove('show');full.disabled=true;verified.style.display='none';activeHit=null;activeNumber=''}function setVol(v){activeVolume=v;v1.classList.toggle('active',v==='vol1');v2.classList.toggle('active',v==='vol2');resetFinder()}v1.onclick=()=>setVol('vol1');v2.onclick=()=>setVol('vol2');document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{activeCollection=b.dataset.id;title.textContent=b.dataset.title;setVol('vol1');volume.classList.toggle('show',activeCollection==='orchestra'||activeCollection==='english');home.classList.remove('active');collection.classList.add('active');scrollTo(0,0)});document.getElementById('back').onclick=()=>{collection.classList.remove('active');home.classList.add('active');resetFinder();scrollTo(0,0)};document.querySelectorAll('[data-key]').forEach(k=>k.onclick=()=>{if(display.value.length<5)display.value+=k.dataset.key;result.classList.remove('show')});document.getElementById('clear').onclick=resetFinder;document.getElementById('find').onclick=()=>{const raw=display.value,n=raw?String(parseInt(raw,10)):'';result.classList.add('show');full.disabled=true;verified.style.display='none';activeHit=null;activeNumber=n;if(!n){resultTitle.textContent='Enter a music number';resultText.textContent='Use the keypad, then press FIND.';return}let hit=null,label='';if(activeCollection==='mixed'){hit=window.MIXED_CHOIR_INDEX&&window.MIXED_CHOIR_INDEX[n];label='Mixed Choir Hymn Collection'}else if(activeCollection==='orchestra'){hit=window.ORCHESTRA_INDEX&&window.ORCHESTRA_INDEX[activeVolume]&&window.ORCHESTRA_INDEX[activeVolume][n];label='Orchestra Development Programme • '+(activeVolume==='vol1'?'Volume I':'Volume II')}else if(activeCollection==='afrikaans'){hit=window.AFRIKAANS_ORGANIST_INDEX&&window.AFRIKAANS_ORGANIST_INDEX[n];label='Organist Manual • Afrikaans'}else if(activeCollection==='english'){hit=window.ENGLISH_ORGANIST_INDEX&&window.ENGLISH_ORGANIST_INDEX[activeVolume]&&window.ENGLISH_ORGANIST_INDEX[activeVolume][n];label='Organist Manual • English • '+(activeVolume==='vol1'?'Volume I':'Volume II')}if(hit){activeHit=hit;resultTitle.textContent=n+'. '+hit.title;resultText.textContent=label+' • source PDF page '+hit.sourcePage+'.';verified.style.display='inline-block';full.disabled=activeCollection!=='mixed';return}resultTitle.textContent='Number '+n+' not found';resultText.textContent='This number is outside the verified index for the selected collection.'};async function openSheet(){if(!activeHit||activeCollection!=='mixed')return;viewer.classList.add('show');viewerTitle.textContent=activeNumber+'. '+activeHit.title;status.textContent='Loading sheet…';canvas.width=1;canvas.height=1;try{const pdf=await pdfjsLib.getDocument(SOURCE_FILES.mixed).promise;const page=await pdf.getPage(Number(activeHit.sourcePage));const base=page.getViewport({scale:1});const available=Math.max(320,window.innerWidth-20);const scale=Math.min(2.2,available/base.width);const viewport=page.getViewport({scale});const ratio=window.devicePixelRatio||1;canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=Math.floor(viewport.width)+'px';canvas.style.height=Math.floor(viewport.height)+'px';const ctx=canvas.getContext('2d');await page.render({canvasContext:ctx,viewport,transform:ratio!==1?[ratio,0,0,ratio,0,0]:null}).promise;status.textContent='PDF page '+activeHit.sourcePage+' • '+activeNumber+'. '+activeHit.title}catch(err){console.error(err);status.textContent='Could not load this sheet. Please go back and try again.'}}full.onclick=openSheet;document.getElementById('viewerBack').onclick=()=>{viewer.classList.remove('show')};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Orchestra Music Companion</title><link rel="manifest" href="manifest.webmanifest"><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#050b16}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#050b16,#0b1424);padding:clamp(18px,4vw,42px)}main{max-width:1050px;margin:auto}.hero,.collection{padding:clamp(22px,4vw,38px);border:1px solid #24324a;border-radius:24px;background:#111b2d}.hero{margin-bottom:24px}.eyebrow{font-weight:800;letter-spacing:.12em;color:#f59e0b;font-size:.82rem}.hero h1{font-size:clamp(2rem,5vw,3.6rem);margin:.35rem 0}.hero p,.card p,.hint,.note{color:#aebbd0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{width:100%;min-height:190px;text-align:left;border:1px solid #2a3a55;border-radius:24px;padding:26px;background:#111b2d;color:#fff}.card .num{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#f59e0b;color:#111827;font-weight:900;margin-bottom:22px}.card h2{font-size:clamp(1.25rem,3vw,2rem);margin:0 0 8px}.screen{display:none}.screen.active{display:block}.back{border:1px solid #33445f;background:#162238;color:#fff;padding:14px 18px;border-radius:14px;font-weight:800;margin-bottom:22px}.collection h2{font-size:clamp(2rem,5vw,3.5rem);margin:.2rem 0 1rem}.finder{margin-top:28px;padding:clamp(18px,4vw,30px);border-radius:20px;background:#08111f;border:1px solid #2a3a55}.finder h3{font-size:clamp(1.35rem,3vw,2rem);margin:0 0 8px}.display{width:100%;font-size:2rem;font-weight:800;text-align:center;padding:18px;border:2px solid #33445f;border-radius:16px;background:#050b16;color:#fff;margin:18px 0}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.key{min-height:72px;border:1px solid #33445f;border-radius:16px;background:#162238;color:#fff;font-size:1.55rem;font-weight:850}.clear{background:#3a1020}.go{background:#f59e0b;color:#111827}.result{display:none;margin-top:20px;padding:20px;border-radius:16px;background:#111b2d;border:1px solid #33445f}.result.show{display:block}.result strong{display:block;font-size:1.35rem;margin-bottom:7px}.badge{display:inline-block;margin-top:12px;padding:7px 10px;border-radius:999px;background:#173524;color:#b7f7ca;font-size:.8rem;font-weight:800}.full{width:100%;margin-top:14px;padding:16px;border:0;border-radius:14px;background:#f59e0b;color:#111827;font-weight:900;font-size:1.05rem}.full:disabled{opacity:.45}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{min-height:150px}}</style></head><body><main><section id="home" class="screen active"><div class="hero"><div class="eyebrow">BUILD 0.1A-03 • SOURCE LIBRARY & SHEET INDEX</div><h1>Orchestra Music Companion</h1><p>Select a music collection.</p></div><div class="grid"><button class="card" data-id="mixed" data-title="Mixed Choir Hymn Collection"><span class="num">1</span><h2>Mixed Choir Hymn Collection</h2><p>Verified source index • active</p></button><button class="card" data-id="orchestra" data-title="Orchestra Development Programme — Volumes I & II"><span class="num">2</span><h2>Orchestra Development Programme</h2><p>Volumes I & II</p></button><button class="card" data-id="afrikaans" data-title="Organist Manual — Afrikaans"><span class="num">3</span><h2>Organist Manual</h2><p>Afrikaans</p></button><button class="card" data-id="english" data-title="Organist Manual — English, Volumes I & II"><span class="num">4</span><h2>Organist Manual</h2><p>English • Volumes I & II</p></button></div></section><section id="collection" class="screen"><button class="back" id="back">← Back to Collections</button><div class="collection"><div class="eyebrow">SELECTED COLLECTION</div><h2 id="collectionTitle"></h2><div class="finder"><h3>Find Music by Number</h3><p class="hint">Enter the number used in this collection.</p><input id="numberDisplay" class="display" inputmode="numeric" readonly placeholder="#"><div class="keypad"><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key clear" id="clear">CLEAR</button><button class="key" data-key="0">0</button><button class="key go" id="find">FIND</button></div><div id="result" class="result"><strong id="resultTitle"></strong><p id="resultText" class="note"></p><span id="verified" class="badge" style="display:none">VERIFIED SOURCE INDEX</span><button id="full" class="full" disabled>OPEN SHEET • FULL SCREEN</button></div></div></div></section></main><script src="data/mixed-choir-index.js"></script><script>const home=document.getElementById('home'),collection=document.getElementById('collection'),title=document.getElementById('collectionTitle'),display=document.getElementById('numberDisplay'),result=document.getElementById('result'),resultTitle=document.getElementById('resultTitle'),resultText=document.getElementById('resultText'),full=document.getElementById('full'),verified=document.getElementById('verified');let activeCollection='';function resetFinder(){display.value='';result.classList.remove('show');full.disabled=true;verified.style.display='none'}document.querySelectorAll('.card').forEach(b=>b.onclick=()=>{activeCollection=b.dataset.id;title.textContent=b.dataset.title;resetFinder();home.classList.remove('active');collection.classList.add('active');scrollTo(0,0)});document.getElementById('back').onclick=()=>{collection.classList.remove('active');home.classList.add('active');resetFinder();scrollTo(0,0)};document.querySelectorAll('[data-key]').forEach(k=>k.onclick=()=>{if(display.value.length<5)display.value+=k.dataset.key;result.classList.remove('show')});document.getElementById('clear').onclick=resetFinder;document.getElementById('find').onclick=()=>{const raw=display.value,n=raw?String(parseInt(raw,10)):'';result.classList.add('show');full.disabled=true;verified.style.display='none';if(!n){resultTitle.textContent='Enter a music number';resultText.textContent='Use the keypad, then press FIND.';return}if(activeCollection==='mixed'){const hit=window.MIXED_CHOIR_INDEX&&window.MIXED_CHOIR_INDEX[n];if(hit){resultTitle.textContent=n+'. '+hit.title;resultText.textContent='Mixed Choir Hymn Collection • source PDF page '+hit.sourcePage+'.';verified.style.display='inline-block';return}resultTitle.textContent='Number '+n+' not indexed yet';resultText.textContent='This number has not yet been verified against the Mixed Choir source PDF.';return}resultTitle.textContent='Collection not active yet';resultText.textContent='BUILD 0.1A-03 is being completed from Collection 1 downward. Mixed Choir is first.'};if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js');</script></body></html>

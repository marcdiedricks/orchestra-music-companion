<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08111f">
<title>Orchestra Music Companion</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#050b16}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#050b16,#0b1424);padding:clamp(18px,4vw,42px)}main{max-width:1050px;margin:auto}.hero{padding:clamp(22px,4vw,38px);border:1px solid #24324a;border-radius:24px;background:#111b2d;margin-bottom:24px}.eyebrow{font-weight:800;letter-spacing:.12em;color:#f59e0b;font-size:.82rem}.hero h1{font-size:clamp(2rem,5vw,3.6rem);margin:.35rem 0}.hero p{margin:0;color:#aebbd0;font-size:clamp(1rem,2.2vw,1.2rem)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.card{width:100%;min-height:190px;text-align:left;border:1px solid #2a3a55;border-radius:24px;padding:26px;background:#111b2d;color:#fff;cursor:pointer;box-shadow:0 10px 28px #0004}.card:active{transform:scale(.99)}.card .num{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:12px;background:#f59e0b;color:#111827;font-weight:900;margin-bottom:22px}.card h2{font-size:clamp(1.25rem,3vw,2rem);margin:0 0 8px}.card p{color:#aebbd0;margin:0;font-size:1rem}.screen{display:none}.screen.active{display:block}.back{border:1px solid #33445f;background:#162238;color:#fff;padding:14px 18px;border-radius:14px;font-weight:800;margin-bottom:22px}.collection{border:1px solid #2a3a55;border-radius:24px;background:#111b2d;padding:clamp(24px,5vw,48px)}.collection h2{font-size:clamp(2rem,5vw,3.5rem);margin:.2rem 0 1rem}.placeholder{margin-top:30px;padding:22px;border-radius:18px;background:#08111f;color:#aebbd0;border:1px dashed #33445f}@media(max-width:700px){.grid{grid-template-columns:1fr}.card{min-height:150px}}
</style>
</head>
<body>
<main>
<section id="home" class="screen active">
<div class="hero"><div class="eyebrow">BUILD 0.1A-01 • OFFLINE-FIRST SHELL</div><h1>Orchestra Music Companion</h1><p>Select a music collection.</p></div>
<div class="grid">
<button class="card" data-title="Mixed Choir Hymn Collection"><span class="num">1</span><h2>Mixed Choir Hymn Collection</h2><p>Open this collection</p></button>
<button class="card" data-title="Orchestra Development Programme — Volumes I & II"><span class="num">2</span><h2>Orchestra Development Programme</h2><p>Volumes I & II</p></button>
<button class="card" data-title="Organist Manual — Afrikaans"><span class="num">3</span><h2>Organist Manual</h2><p>Afrikaans</p></button>
<button class="card" data-title="Organist Manual — English, Volumes I & II"><span class="num">4</span><h2>Organist Manual</h2><p>English • Volumes I & II</p></button>
</div>
</section>
<section id="collection" class="screen"><button class="back" id="back">← Back to Collections</button><div class="collection"><div class="eyebrow">SELECTED COLLECTION</div><h2 id="collectionTitle"></h2><div class="placeholder">Collection separation confirmed. The universal number finder will be added in BUILD 0.1A-02.</div></div></section>
</main>
<script>
const home=document.getElementById('home'),collection=document.getElementById('collection'),title=document.getElementById('collectionTitle');
document.querySelectorAll('.card').forEach(b=>b.addEventListener('click',()=>{title.textContent=b.dataset.title;home.classList.remove('active');collection.classList.add('active');scrollTo(0,0)}));
document.getElementById('back').addEventListener('click',()=>{collection.classList.remove('active');home.classList.add('active');scrollTo(0,0)});
if('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js');
</script>
</body></html>

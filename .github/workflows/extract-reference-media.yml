name: Extract Reference Media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download reference media archive
        run: |
          curl -L --fail --retry 3 \
            'https://drive.usercontent.google.com/download?id=1LmQFp381gNYvivpLKNp452XqpNQLiaD4&export=download&confirm=t' \
            -o orchestra-reference-media-23.zip
          unzip -t orchestra-reference-media-23.zip

      - name: Extract reference media
        run: |
          rm -rf reference-media
          mkdir -p reference-media
          unzip -o orchestra-reference-media-23.zip -d reference-media
          test "$(find reference-media -type f \( -iname '*.mp3' -o -iname '*.mp4' \) | wc -l)" -eq 23

      - name: Commit extracted reference media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-media
          git commit -m "BUILD 0.1B-03: add reference media assets" || exit 0
          git push

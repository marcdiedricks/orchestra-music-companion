name: Extract Reference Media

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract reference media
        run: |
          mkdir -p reference-media
          unzip -o orchestra-reference-media-23.zip -d reference-media

      - name: Commit extracted reference media
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference-media
          git commit -m "BUILD 0.1B-02: extract online reference media" || exit 0
          git push

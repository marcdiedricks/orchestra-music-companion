<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Additional Music • Orchestra Music Companion</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#050b16}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#050b16,#0b1424);padding:clamp(18px,4vw,42px)}main{max-width:1050px;margin:auto}.back,.action{display:inline-block;text-decoration:none;border:1px solid #33445f;background:#162238;color:#fff;padding:14px 18px;border-radius:14px;font-weight:800}.back{margin-bottom:22px}.collection{padding:clamp(22px,4vw,38px);border:1px solid #24324a;border-radius:24px;background:#111b2d}.eyebrow{font-weight:800;letter-spacing:.12em;color:#f59e0b;font-size:.82rem}.collection h1{font-size:clamp(2rem,5vw,3.5rem);margin:.2rem 0 .6rem}.hint,.small{color:#aebbd0}.search,input{width:100%;margin:10px 0;padding:15px;border:2px solid #33445f;border-radius:14px;background:#050b16;color:#fff;font-size:1rem}.search{margin:20px 0;font-size:1.1rem}.letters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.letter{border:1px solid #33445f;background:#162238;color:#fff;padding:10px 12px;border-radius:12px;font-weight:850}.letter.active{background:#f59e0b;color:#111827}.work,.sheet{width:100%;text-align:left;border:1px solid #2a3a55;border-radius:16px;padding:17px 18px;margin:10px 0;background:#08111f;color:#fff}.work strong,.sheet strong{display:block;font-size:1.08rem}.work span,.sheet span{display:block;color:#aebbd0;margin-top:5px}.sheet{display:block;text-decoration:none}.empty{color:#aebbd0;padding:20px 0}.sheet-panel,.import-panel{margin:14px 0 22px;padding:16px;border:1px solid #33445f;border-radius:16px;background:#0b1424}.sheet-panel h2,.import-panel h2{margin:0 0 10px;font-size:1.2rem}.close{border:1px solid #33445f;background:#162238;color:#fff;padding:9px 12px;border-radius:10px;font-weight:800;margin-bottom:8px}.import-head{margin:24px 0 14px;padding:18px;border:1px solid #6b4d13;border-radius:18px;background:#17130b}.import-head strong{display:block;color:#fbbf24;font-size:1.05rem}.action{width:100%;margin-top:10px;cursor:pointer}.action.primary{background:#f59e0b;color:#111827;border-color:#f59e0b}.action.approve{background:#166534;border-color:#22c55e}.action.reject{background:#3f1d1d;border-color:#7f1d1d}.notice{padding:12px;margin-top:12px;border-radius:12px;background:#08111f;color:#cbd5e1}.queue{margin-top:14px}.queue-item{padding:14px;border:1px solid #33445f;border-radius:12px;margin:10px 0}.queue-item strong{display:block}.danger{color:#fca5a5}.ok{color:#86efac}.owner{margin-top:10px;padding-top:10px;border-top:1px solid #263650}.status{font-weight:800;color:#fbbf24}</style></head><body><main><a class="back" href="./index.html">← Back to Collections</a><section class="collection"><div class="eyebrow">COLLECTION 5</div><h1>Additional Music</h1><p class="hint">Browse alphabetically or search by musical title.</p><input id="search" class="search" type="search" autocomplete="off" placeholder="Search by title"><div id="letters" class="letters"></div><div id="works"></div><div id="ownerTools"></div></section></main><script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script><script src="data/additional-music-foundation.js"></script><script>const data=window.ADDITIONAL_MUSIC_FOUNDATION||{works:[]};const search=document.getElementById('search'),letters=document.getElementById('letters'),works=document.getElementById('works');let active='ALL';const available=['ALL',...new Set(data.works.map(w=>w.az_letter))];const base='assets/additional-music/additional-music/';const slug=s=>s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/&/g,' ').replace(/[’']/g,' ').replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');function renderLetters(){letters.innerHTML='';available.forEach(l=>{const b=document.createElement('button');b.className='letter'+(active===l?' active':'');b.textContent=l;b.onclick=()=>{active=l;renderLetters();renderWorks()};letters.appendChild(b)})}async function openWork(w,b){document.querySelectorAll('.sheet-panel').forEach(x=>x.remove());const panel=document.createElement('div');panel.className='sheet-panel';panel.innerHTML='<button class="close">Close sheets</button><h2></h2><div class="hint">Loading available sheets…</div>';panel.querySelector('h2').textContent=w.title;b.after(panel);panel.querySelector('.close').onclick=()=>panel.remove();try{const dir=base+slug(w.title)+'/';const api='https://api.github.com/repos/marcdiedricks/orchestra-music-companion/contents/'+dir;const r=await fetch(api);if(!r.ok)throw new Error();const files=(await r.json()).filter(f=>f.type==='file'&&/\.pdf$/i.test(f.name));panel.querySelector('.hint').remove();if(!files.length){panel.insertAdjacentHTML('beforeend','<div class="empty">No PDF sheets found.</div>');return}files.forEach(f=>{const a=document.createElement('a');a.className='sheet';a.href=dir+encodeURIComponent(f.name);a.innerHTML='<strong></strong><span>Open PDF sheet</span>';a.querySelector('strong').textContent=f.name.replace(/\.pdf$/i,'');panel.appendChild(a)})}catch(e){panel.querySelector('.hint').textContent='Unable to load the sheet list. Please check your internet connection and try again.'}}function renderWorks(){const q=search.value.trim().toLowerCase();const list=data.works.filter(w=>(active==='ALL'||w.az_letter===active)&&(!q||w.title.toLowerCase().includes(q)));works.innerHTML='';if(!list.length){works.innerHTML='<div class="empty">No matching musical title.</div>';return}list.forEach(w=>{const b=document.createElement('button');b.className='work';b.innerHTML='<strong></strong><span></span>';b.querySelector('strong').textContent=w.title;b.querySelector('span').textContent=w.sheet_count+' available sheet'+(w.sheet_count===1?'':'s')+' • Tap to choose a sheet';b.onclick=()=>openWork(w,b);works.appendChild(b)})}search.oninput=()=>{active='ALL';renderLetters();renderWorks()};renderLetters();renderWorks();</script><script>
(function(){
 const host=document.getElementById('ownerTools');
 function render(user){
   if(!user){host.innerHTML='';return}
   host.innerHTML='<div class="import-head owner"><strong>OWNER • ADD MUSIC</strong><span class="small">Signed in securely</span></div><div class="import-panel"><h2>Add Music PDF</h2><label class="small" for="ownerPdf">PDF file</label><input id="ownerPdf" type="file" accept="application/pdf,.pdf"><label class="small" for="ownerTitle">Musical title</label><input id="ownerTitle" type="text" autocomplete="off" placeholder="Enter or confirm title"><label class="small" for="ownerPart">Part / sheet name</label><input id="ownerPart" type="text" autocomplete="off" placeholder="e.g. Organ, Trumpet 1"><button id="ownerReview" class="action primary" disabled>Review PDF</button><div id="ownerStatus" class="notice">Choose one PDF to continue.</div></div>';
   const f=document.getElementById('ownerPdf'),t=document.getElementById('ownerTitle'),p=document.getElementById('ownerPart'),b=document.getElementById('ownerReview'),s=document.getElementById('ownerStatus');
   function check(){const ok=f.files&&f.files.length===1&&/\.pdf$/i.test(f.files[0].name)&&t.value.trim()&&p.value.trim();b.disabled=!ok;s.textContent=ok?'Ready to review. Nothing has been published yet.':'Choose one PDF and complete the title and part.'}
   [f,t,p].forEach(x=>x.addEventListener('input',check));f.addEventListener('change',check);
   b.onclick=function(){const file=f.files[0];s.innerHTML='<strong>REVIEW</strong><br>'+t.value.trim()+' • '+p.value.trim()+'<br>'+file.name+'<br><span class="status">Publishing remains locked until the server-side publisher is connected.</span>'};
 }
 if(window.netlifyIdentity){netlifyIdentity.on('init',render);netlifyIdentity.on('login',render);netlifyIdentity.on('logout',()=>render(null));netlifyIdentity.init()}
})();
</script></body></html>

<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08111f"><title>Additional Music • Orchestra Music Companion</title><style>:root{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#f8fafc;background:#050b16}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(180deg,#050b16,#0b1424);padding:clamp(18px,4vw,42px)}main{max-width:1050px;margin:auto}.back{display:inline-block;text-decoration:none;border:1px solid #33445f;background:#162238;color:#fff;padding:14px 18px;border-radius:14px;font-weight:800;margin-bottom:22px}.collection{padding:clamp(22px,4vw,38px);border:1px solid #24324a;border-radius:24px;background:#111b2d}.eyebrow{font-weight:800;letter-spacing:.12em;color:#f59e0b;font-size:.82rem}.collection h1{font-size:clamp(2rem,5vw,3.5rem);margin:.2rem 0 .6rem}.hint{color:#aebbd0}.search{width:100%;margin:20px 0;padding:16px 18px;border:2px solid #33445f;border-radius:16px;background:#050b16;color:#fff;font-size:1.1rem}.letters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.letter{border:1px solid #33445f;background:#162238;color:#fff;padding:10px 12px;border-radius:12px;font-weight:850}.letter.active{background:#f59e0b;color:#111827}.work{width:100%;text-align:left;border:1px solid #2a3a55;border-radius:16px;padding:17px 18px;margin:10px 0;background:#08111f;color:#fff}.work strong{display:block;font-size:1.08rem}.work span{display:block;color:#aebbd0;margin-top:5px}.empty{color:#aebbd0;padding:20px 0}</style></head><body><main><a class="back" href="./index.html">← Back to Collections</a><section class="collection"><div class="eyebrow">BUILD 0.1B-01A • COLLECTION 5 FOUNDATION</div><h1>Additional Music</h1><p class="hint">Browse alphabetically or search by musical title.</p><input id="search" class="search" type="search" autocomplete="off" placeholder="Search by title"><div id="letters" class="letters"></div><div id="works"></div></section></main><script src="data/additional-music-foundation.js"></script><script>const data=window.ADDITIONAL_MUSIC_FOUNDATION||{works:[]};const search=document.getElementById('search'),letters=document.getElementById('letters'),works=document.getElementById('works');let active='ALL';const available=['ALL',...new Set(data.works.map(w=>w.az_letter))];function renderLetters(){letters.innerHTML='';available.forEach(l=>{const b=document.createElement('button');b.className='letter'+(active===l?' active':'');b.textContent=l;b.onclick=()=>{active=l;renderLetters();renderWorks()};letters.appendChild(b)})}function renderWorks(){const q=search.value.trim().toLowerCase();const list=data.works.filter(w=>(active==='ALL'||w.az_letter===active)&&(!q||w.title.toLowerCase().includes(q)));works.innerHTML='';if(!list.length){works.innerHTML='<div class="empty">No matching musical title.</div>';return}list.forEach(w=>{const b=document.createElement('button');b.className='work';b.innerHTML='<strong></strong><span></span>';b.querySelector('strong').textContent=w.title;b.querySelector('span').textContent=w.sheet_count+' available sheet'+(w.sheet_count===1?'':'s')+' • PDF connection follows in BUILD 0.1B-01B';b.onclick=()=>alert(w.title+'\n\n'+w.sheet_count+' available sheets.\n\nSheet selection is connected in the next controlled build.');works.appendChild(b)})}search.addEventListener('input',()=>{active='ALL';renderLetters();renderWorks()});renderLetters();renderWorks();</script></body></html>
